<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中秋 Live Quiz · 大屏幕</title><link rel="stylesheet" href="/style.css"><style>main{max-width:1200px}.display-title{font-size:clamp(34px,6vw,76px)}.display-code{font-size:clamp(48px,9vw,110px);letter-spacing:12px;font-weight:950;color:var(--accent)}.display-question{font-size:clamp(30px,5vw,62px);font-weight:900}.display-answer{font-size:clamp(22px,3vw,38px);padding:20px}.qrlarge{width:min(300px,55vw)}</style></head><body><main><section class="hero"><div class="moon">🌕</div><h1 class="display-title">月满中秋 · 全场答题挑战赛</h1></section><section id="lobby" class="card center"><h2>扫码加入 · Scan to Join</h2><img id="qr" class="qrlarge" alt="Join QR Code"><div id="code" class="display-code"></div><p id="count" class="bigtime">0 人已加入</p></section><section id="question" class="card hidden"><div class="topbar"><span id="counter" class="pill"></span><span id="timer" class="bigtime"></span></div><div id="qtext" class="display-question" style="margin:30px 0"></div><div id="opts" class="answers"></div><p id="answered" class="center bigtime"></p></section><section id="reveal" class="card hidden center"><h2>正确答案</h2><div id="correct" class="display-question"></div><h2 style="margin-top:28px">Top 10</h2><div id="board"></div></section><section id="finish" class="card hidden center"><div class="moon">🏆</div><h1 class="display-title">最终排行榜</h1><div id="final"></div></section></main><script src="/socket.io/socket.io.js"></script><script>const socket=io(),$=id=>document.getElementById(id),room=(new URLSearchParams(location.search).get('room')||'').toUpperCase();let start=0,dur=15000,tick=null;function show(id){['lobby','question','reveal','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function board(list,id){$(id).innerHTML=list.slice(0,10).map(p=>`<div class="leader"><div class="rank">${p.rank<=3?['🥇','🥈','🥉'][p.rank-1]:p.rank}</div><div style="font-size:22px"><strong>${esc(p.name)}</strong></div><div class="score" style="font-size:22px">${p.score}</div></div>`).join('')}if(!room){$('code').textContent='NO ROOM'}else{const join=`${location.origin}/?room=${room}`;$('code').textContent=room;$('qr').src='/api/qr?text='+encodeURIComponent(join);socket.emit('spectator:join',{code:room},r=>{if(r&&r.ok){$('count').textContent=r.room.playerCount+' 人已加入';if(r.currentQuestion){show('question')}}})}socket.on('room:update',r=>{if(r.code!==room)return;$('count').textContent=r.playerCount+' 人已加入';if(r.status==='lobby')show('lobby');if(r.status==='question'&&r.answerStats)$('answered').textContent=`已回答 ${r.answerStats.answered} / ${r.answerStats.total}`});socket.on('question:start',q=>{show('question');$('counter').textContent=`第 ${q.number} / ${q.total} 题`;$('qtext').textContent=q.text;$('opts').innerHTML=q.options.map((x,i)=>`<div class="answer display-answer"><b>${'ABCD'[i]}.</b> ${esc(x)}</div>`).join('');start=Date.now();dur=q.durationMs;clearInterval(tick);tick=setInterval(()=>{$('timer').textContent=(Math.max(0,dur-(Date.now()-start))/1000).toFixed(1)},100)});socket.on('question:reveal',r=>{clearInterval(tick);show('reveal');$('correct').textContent=`${'ABCD'[r.correctIndex]}. ${r.correctText}`;board(r.leaderboard,'board')});socket.on('game:finished',r=>{clearInterval(tick);show('finish');board(r.leaderboard,'final')});</script></body></html>
