<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月满中秋 · Live Quiz</title><link rel="stylesheet" href="/style.css"></head><body><main><section class="hero"><div class="moon">🌕</div><h1>月满中秋 · 全场答题挑战赛</h1><p>Mid-Autumn Live Quiz</p></section><section id="joinPanel" class="card joinbox"><h2>加入游戏</h2><label>房间号码 Room Code</label><input id="code" maxlength="6" autocomplete="off" style="text-transform:uppercase" placeholder="例如 ABC123"><label>你的名字 / Nickname</label><input id="name" maxlength="24" placeholder="例如 Ah Ming / 小杰"><div class="actions" style="margin-top:16px"><button class="btn primary" id="joinBtn">加入 Join</button><a class="btn secondary" href="/admin.html">管理员 Admin</a></div><p id="joinMsg" class="muted"></p></section>
<section id="gamePanel" class="hidden"><div class="topbar card"><div><span class="muted">Room</span> <strong id="roomCode"></strong> · <span id="playerName"></span></div><span class="pill" id="statePill">等待开始</span></div><div id="waiting" class="card center" style="margin-top:16px"><div class="moon">🥮</div><h2>已成功加入</h2><p class="muted">请看大屏幕，等待主持人开始。</p></div><div id="questionPanel" class="card hidden" style="margin-top:16px"><div class="topbar"><span id="qCounter" class="pill"></span><span id="timeLeft" class="bigtime">15.0</span></div><div class="progress"><div id="timeBar"></div></div><div id="qText" class="question"></div><div id="answers" class="answers"></div><p id="answerMsg" class="muted"></p></div><div id="resultPanel" class="card hidden center" style="margin-top:16px"><h2 id="resultTitle">答案公布</h2><p id="resultText"></p><p class="muted">请等待下一题。</p></div><div id="finishPanel" class="card hidden" style="margin-top:16px"><h2 class="center">🏆 最终排行榜</h2><div id="finalBoard"></div></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();const $=id=>document.getElementById(id);let room='',playerId='',answered=false,tick=null,questionStart=0,duration=15000;const params=new URLSearchParams(location.search);if(params.get('room'))$('code').value=params.get('room').toUpperCase();
$('joinBtn').onclick=()=>{const code=$('code').value.trim().toUpperCase(),name=$('name').value.trim();socket.emit('player:join',{code,name},res=>{if(!res.ok){$('joinMsg').textContent=res.error;return}room=code;playerId=res.playerId;$('roomCode').textContent=room;$('playerName').textContent=name;$('joinPanel').classList.add('hidden');$('gamePanel').classList.remove('hidden');$('statePill').textContent=res.room.status==='lobby'?'等待开始':'已加入'});};
function showQuestion(q){answered=false;duration=q.durationMs;questionStart=Date.now();$('waiting').classList.add('hidden');$('resultPanel').classList.add('hidden');$('finishPanel').classList.add('hidden');$('questionPanel').classList.remove('hidden');$('statePill').textContent='答题中';$('qCounter').textContent=`第 ${q.number} / ${q.total} 题`;$('qText').textContent=q.text;$('answerMsg').textContent='请选择 A / B / C / D';$('answers').innerHTML=q.options.map((x,i)=>`<button class="answer" data-i="${i}"><b>${'ABCD'[i]}.</b> ${escapeHtml(x)}</button>`).join('');[...$('answers').querySelectorAll('button')].forEach(b=>b.onclick=()=>submitAnswer(Number(b.dataset.i),b));clearInterval(tick);tick=setInterval(()=>{const left=Math.max(0,duration-(Date.now()-questionStart));$('timeLeft').textContent=(left/1000).toFixed(1);$('timeBar').style.width=(left/duration*100)+'%';if(left<=0){clearInterval(tick);[...$('answers').querySelectorAll('button')].forEach(b=>b.disabled=true);$('answerMsg').textContent='时间到，等待答案公布。'}},100);}
function submitAnswer(i,btn){if(answered)return;answered=true;[...$('answers').querySelectorAll('button')].forEach(b=>b.disabled=true);btn.classList.add('selected');$('answerMsg').textContent='答案已提交 ✓';socket.emit('player:answer',{code:room,playerId,answerIndex:i},res=>{if(!res.ok)$('answerMsg').textContent=res.error;});}
socket.on('question:start',q=>showQuestion(q));socket.on('question:reveal',r=>{clearInterval(tick);$('questionPanel').classList.add('hidden');$('resultPanel').classList.remove('hidden');$('statePill').textContent='答案公布';$('resultText').innerHTML=`正确答案：<strong>${'ABCD'[r.correctIndex]}. ${escapeHtml(r.correctText)}</strong>`;});socket.on('game:finished',r=>{clearInterval(tick);$('questionPanel').classList.add('hidden');$('resultPanel').classList.add('hidden');$('finishPanel').classList.remove('hidden');$('statePill').textContent='比赛结束';renderBoard(r.leaderboard,$('finalBoard'));});
function renderBoard(list,el){el.innerHTML=list.slice(0,20).map(p=>`<div class="leader"><div class="rank">${p.rank<=3?['🥇','🥈','🥉'][p.rank-1]:p.rank}</div><div><strong>${escapeHtml(p.name)}</strong><div class="muted tiny">答对 ${p.correct} 题 · ${(p.totalTimeMs/1000).toFixed(2)}s</div></div><div class="score">${p.score}</div></div>`).join('')||'<p class="muted">暂无成绩</p>';}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
