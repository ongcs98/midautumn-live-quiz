<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · 中秋 Live Quiz</title><link rel="stylesheet" href="/style.css"></head><body><main><section class="hero"><div class="moon">🌕</div><h1>中秋 Live Quiz · 管理员</h1><p>建立题目、控制比赛、查看实时排行榜</p></section><section id="createPanel" class="card"><div class="grid two"><div><label>活动名称</label><input id="title" value="月满中秋 · 全场答题挑战赛"></div><div><label>Admin Password</label><input id="password" type="password" placeholder="Admin password"></div><div><label>每题时间</label><select id="seconds"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></div></div><button id="createBtn" class="btn primary" style="margin-top:14px">建立新游戏</button><p id="createMsg" class="muted"></p></section>
<section id="adminPanel" class="hidden"><div class="card"><div class="topbar"><div><span class="muted">Room Code</span><div class="roomcode" id="roomCode"></div><div class="tiny muted">参加者打开：<span id="joinUrl"></span></div><div class="actions" style="margin-top:8px"><a id="displayLink" class="btn secondary tiny" target="_blank">打开大屏幕模式</a></div></div><div class="center"><img id="qr" alt="Join QR Code" style="width:150px;max-width:100%;border-radius:12px"><div><span class="pill" id="playerCount">0 人</span></div></div></div></div>
<div class="grid two" style="margin-top:16px"><section class="card"><h2>建立题目</h2><label>题目</label><textarea id="qText" placeholder="例如：中秋节通常是农历哪一天？"></textarea><div class="grid two"><div><label>A</label><input id="a"></div><div><label>B</label><input id="b"></div><div><label>C</label><input id="c"></div><div><label>D</label><input id="d"></div></div><label>正确答案</label><select id="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><div class="actions" style="margin-top:14px"><button id="addQ" class="btn primary">加入题目</button><button id="sampleQ" class="btn secondary">载入示范题</button></div><p id="qMsg" class="muted"></p><div id="qList"></div></section>
<section class="card"><h2>比赛控制</h2><div class="status" id="gameState">等待参加者加入。</div><div class="actions" style="margin-top:14px"><button id="startBtn" class="btn gold">开始比赛</button><button id="revealBtn" class="btn secondary" disabled>立即公布答案</button><button id="nextBtn" class="btn primary" disabled>下一题</button></div><div id="liveQuestion" class="hidden" style="margin-top:18px"><div class="topbar"><span class="pill" id="liveCounter"></span><span class="bigtime" id="adminTimer">15.0</span></div><div class="question" id="liveText"></div></div><h3 style="margin-top:22px">实时排行榜</h3><div id="leaderboard"><p class="muted">暂无成绩</p></div></section></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();const $=id=>document.getElementById(id);let code='',token='',questions=[],timer=null,qStart=0,qDur=15000;function saveAdmin(){sessionStorage.setItem('maq_code',code);sessionStorage.setItem('maq_token',token)}
$('createBtn').onclick=()=>socket.emit('admin:create',{title:$('title').value,secondsPerQuestion:Number($('seconds').value),password:$('password').value},r=>{if(!r.ok)return $('createMsg').textContent=r.error;code=r.code;token=r.adminToken;saveAdmin();openAdmin(r.room)});
function openAdmin(room){$('createPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');$('roomCode').textContent=code;const join=`${location.origin}/?room=${code}`;$('joinUrl').textContent=join;$('qr').src='/api/qr?text='+encodeURIComponent(join);$('displayLink').href=`/display.html?room=${code}`;$('playerCount').textContent=room.playerCount+' 人';renderQuestions();}
function syncQuestions(){socket.emit('admin:setQuestions',{code,adminToken:token,questions,secondsPerQuestion:Number($('seconds').value)},r=>{$('qMsg').textContent=r.ok?`已保存 ${r.count} 题`:r.error;});}
$('addQ').onclick=()=>{const text=$('qText').value.trim(),opts=[$('a').value.trim(),$('b').value.trim(),$('c').value.trim(),$('d').value.trim()];if(!text||opts.some(x=>!x)){return $('qMsg').textContent='请填完整题目和 A/B/C/D。'}questions.push({text,options:opts,correctIndex:Number($('correct').value)});['qText','a','b','c','d'].forEach(id=>$(id).value='');renderQuestions();syncQuestions();};
$('sampleQ').onclick=()=>{questions=[{text:'中秋节通常是在农历哪一天？',options:['七月十五','八月十五','九月初九','正月十五'],correctIndex:1},{text:'“但愿人长久”的下一句是？',options:['千里共婵娟','海上生明月','举头望明月','月是故乡明'],correctIndex:0},{text:'中秋节最常见的传统食品是？',options:['粽子','汤圆','月饼','年糕'],correctIndex:2},{text:'传说中住在月亮上的人物是谁？',options:['嫦娥','花木兰','西施','王昭君'],correctIndex:0},{text:'中秋节最常见的主题是？',options:['团圆','登高','扫墓','守岁'],correctIndex:0}];renderQuestions();syncQuestions();};
function renderQuestions(){$('qList').innerHTML=questions.map((q,i)=>`<div class="qrow"><strong>${i+1}. ${esc(q.text)}</strong><div class="muted tiny">正确：${'ABCD'[q.correctIndex]}</div><button class="btn secondary tiny" data-del="${i}" style="margin-top:7px">删除</button></div>`).join('')||'<p class="muted">还没有题目。</p>';[...$('qList').querySelectorAll('[data-del]')].forEach(b=>b.onclick=()=>{questions.splice(Number(b.dataset.del),1);renderQuestions();syncQuestions()})}
$('startBtn').onclick=()=>socket.emit('admin:start',{code,adminToken:token},r=>{if(!r.ok)$('gameState').textContent=r.error});$('revealBtn').onclick=()=>socket.emit('admin:reveal',{code,adminToken:token});$('nextBtn').onclick=()=>socket.emit('admin:next',{code,adminToken:token},r=>{if(r.finished)$('gameState').textContent='比赛结束！'});
socket.on('room:update',r=>{if(r.code!==code)return;$('playerCount').textContent=r.playerCount+' 人';if(r.leaderboard)renderBoard(r.leaderboard);if(r.answerStats&&r.status==='question')$('gameState').textContent=`答题中 · 已回答 ${r.answerStats.answered} / ${r.answerStats.total}`;});socket.on('question:start',q=>{$('gameState').textContent='第 '+q.number+' 题进行中';$('liveQuestion').classList.remove('hidden');$('liveCounter').textContent=`第 ${q.number} / ${q.total} 题`;$('liveText').textContent=q.text;$('revealBtn').disabled=false;$('nextBtn').disabled=true;qStart=Date.now();qDur=q.durationMs;clearInterval(timer);timer=setInterval(()=>{$('adminTimer').textContent=(Math.max(0,qDur-(Date.now()-qStart))/1000).toFixed(1)},100);});socket.on('question:reveal',r=>{clearInterval(timer);$('gameState').innerHTML=`答案：<strong>${'ABCD'[r.correctIndex]}. ${esc(r.correctText)}</strong>`;$('revealBtn').disabled=true;$('nextBtn').disabled=false;renderBoard(r.leaderboard);if(r.stats){$('gameState').innerHTML+=`<div class="tiny muted" style="margin-top:6px">A ${r.stats.counts[0]} · B ${r.stats.counts[1]} · C ${r.stats.counts[2]} · D ${r.stats.counts[3]}</div>`}});socket.on('game:finished',r=>{clearInterval(timer);$('gameState').textContent='🏆 比赛结束';$('liveQuestion').classList.add('hidden');$('nextBtn').disabled=true;renderBoard(r.leaderboard)});
function renderBoard(list){$('leaderboard').innerHTML=list.slice(0,20).map(p=>`<div class="leader"><div class="rank">${p.rank<=3?['🥇','🥈','🥉'][p.rank-1]:p.rank}</div><div><strong>${esc(p.name)}</strong><div class="muted tiny">答对 ${p.correct} · ${(p.totalTimeMs/1000).toFixed(2)}s</div></div><div class="score">${p.score}</div></div>`).join('')||'<p class="muted">暂无成绩</p>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const oldCode=sessionStorage.getItem('maq_code'),oldToken=sessionStorage.getItem('maq_token');if(oldCode&&oldToken){socket.emit('admin:join',{code:oldCode,adminToken:oldToken},r=>{if(r.ok){code=oldCode;token=oldToken;questions=r.questions||[];openAdmin(r.room)}})}
</script></body></html>
